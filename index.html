<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0c0e15">
<title>PixelWave · Фото через звук</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f6f6fa;background:#0c0e15}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
main{max-width:560px;margin:auto;padding:24px 20px 60px}
.brand{font-size:23px;font-weight:750;letter-spacing:-.8px;margin-bottom:24px}.brand i{font-style:normal;color:#a7a1ff}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:17px;background:#1c1e29;gap:4px}
.tabs button{border-radius:13px;background:transparent}.tabs button.active{background:#343747}
button,.pick{font:inherit;font-weight:650;border:0;border-radius:16px;padding:16px 18px;background:#272b3b;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:default}
.primary,.pick{background:#a7a1ff;color:#10101a}.primary{width:100%;margin-top:16px;font-size:17px}
.secondary{background:transparent;border:1px solid #404356;width:100%;margin-top:12px}
.screen{margin-top:22px}
.hero{min-height:220px;background:#171a25;border:1px solid #292d3e;border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.hero canvas{width:100%;height:auto;max-height:55vh;object-fit:contain;display:block;image-rendering:auto}
.placeholder{text-align:center;color:#9da1b7;padding:36px}.placeholder .emoji{font-size:54px;margin-bottom:12px}
#file{display:none}.pick{display:block;text-align:center;margin-top:16px}
.hide{display:none!important}
.slider{margin-top:20px;background:#1a1d29;padding:16px 18px 14px;border-radius:20px}
.slider .ends{display:flex;justify-content:space-between;font-size:14px;color:#b5b9cc;margin-bottom:10px}
.slider input{width:100%;accent-color:#a7a1ff;height:28px}
.slider .value{text-align:center;font-size:20px;font-weight:700;margin-top:6px}
.slider .value small{display:block;font-size:13px;font-weight:500;color:#8d92aa;margin-top:2px}
.toggle{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid #2a2e3f;cursor:pointer}
.toggle input{display:none}.toggle .sw{flex:none;width:46px;height:28px;border-radius:14px;background:#33374a;position:relative;transition:background .2s}
.toggle .sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.toggle input:checked+.sw{background:#a7a1ff}.toggle input:checked+.sw:after{left:21px}
.toggle small{display:block;font-size:12.5px;color:#8d92aa;margin-top:2px;line-height:1.35}
.bar{position:absolute;bottom:0;left:0;height:4px;background:#a7a1ff;transition:width .3s;width:0}
#status{min-height:22px;font-size:15px;text-align:center;margin-top:16px;color:#d6d8e6}
.stats{font-size:13px;text-align:center;color:#8d92aa;margin:10px 0}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}.meter span{width:6px;height:12px;border-radius:2px;background:#33374a}.meter span.on{background:#7be3a8}
.debug{margin-top:28px;font-size:13px;color:#8d92aa}.debug input{display:block;margin:8px 0;color:#8d92aa}
.foot{font-size:13px;text-align:center;color:#6f7389;margin-top:26px;line-height:1.5}
</style>
</head>
<body>
<main>
  <div class="brand">◉ Pixel<i>Wave</i></div>
  <div class="tabs"><button id="tabTx" class="active">↑ Отправить</button><button id="tabRx">↓ Принять</button></div>

  <section class="screen" id="tx">
    <div class="hero">
      <div id="emptyTx" class="placeholder"><div class="emoji">🖼️</div>Выбери фотографию</div>
      <canvas id="preview" class="hide"></canvas>
      <div class="bar" id="txBar"></div>
    </div>
    <input type="file" id="file" accept="image/*">
    <label for="file" class="pick" id="choose">Выбрать фото</label>
    <div class="slider" id="sliderBox">
      <div class="ends"><span>⚡ Быстрее</span><span>Качественнее ✨</span></div>
      <input type="range" id="level" min="0" max="10" step="1" value="1">
      <div class="value" id="estimate">—<small>выбери фото, чтобы увидеть время</small></div>
      <label class="toggle"><input type="checkbox" id="quiet"><span class="sw"></span><span><b>🤫 Тихий режим</b><small>Неслышимый звук 17–20 кГц. Медленнее, телефоны держи ближе (10–30 см)</small></span></label>
    </div>
    <button id="send" class="primary" disabled>▶ Передать звуком</button>
    <button id="stopTx" class="secondary hide">Остановить</button>
  </section>

  <section class="screen hide" id="rx">
    <div class="hero">
      <div id="emptyRx" class="placeholder"><div class="emoji">🎙️</div>Нажми «Слушать», потом начни передачу на другом телефоне</div>
      <canvas id="received" class="hide"></canvas>
      <div class="bar" id="rxBar"></div>
    </div>
    <button id="listen" class="primary">🎙 Слушать</button>
    <button id="stopRx" class="secondary hide">Остановить</button>
    <button id="save" class="secondary hide">↓ Сохранить фото</button>
    <p class="stats" id="rxStats"></p>
  </section>

  <p id="status" role="status"></p>
  <div id="debug" class="debug hide">
    <button class="secondary" id="downloadWav" disabled>Скачать WAV</button>
    <label>Декодировать WAV <input type="file" id="wav" accept="audio/*"></label>
  </div>
  <p class="foot">Без интернета и Bluetooth. Держи телефоны рядом, громкость на максимум, экран не блокируй.</p>
</main>
<script src="rs.js"></script>
<script src="modem.js"></script>
<script src="codec.js"></script>
<script src="app.js"></script>
</body>
</html>
